[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-web-ui-skill"
version = "2.1.0"
description = "Deterministic CLI and Codex Skill for behavior-preserving retro desktop UI conversions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "retro-web-ui contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
release = ["build>=1.2,<2"]
gui = ["PySide6>=6.8,<7"]
native = [
  "PySide6==6.11.2",
  "Nuitka==4.1.1",
  "Pillow==12.3.0",
  "ordered-set==4.1.0",
  "zstandard==0.25.0",
  "patchelf==0.19.1.0; platform_system == 'Linux'",
]

[project.urls]
Homepage = "https://github.com/ririri-rgb/retro-web-ui"
Repository = "https://github.com/ririri-rgb/retro-web-ui"
Issues = "https://github.com/ririri-rgb/retro-web-ui/issues"

[project.scripts]
retro-web-ui = "retro_web_ui.scripts.retro_web_ui:main"
retro-web-ui-gui = "retro_web_ui_gui.app:main"

[tool.setuptools]
packages = ["retro_web_ui", "retro_web_ui.core", "retro_web_ui.scripts", "retro_web_ui_gui"]
package-dir = { retro_web_ui = "skills/retro-web-ui" }
include-package-data = false

[tool.setuptools.package-data]
retro_web_ui = [
  "SKILL.md",
  "LICENSE",
  "manifest.json",
  "agents/*.yaml",
  "assets/showcase/*.css",
  "assets/showcase/*.html",
  "assets/showcase/*.js",
  "assets/theme-kit/*.css",
  "references/*.md",
  "references/themes/*.md",
]

[tool.ruff]
line-length = 140
