name: Native desktop artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, codex/retro-web-ui-desktop-gui]
    paths:
      - ".github/workflows/native.yml"
      - "VERSION"
      - "pyproject.toml"
      - "deployment/**"
      - "distribution/**"
      - "retro_web_ui_gui/**"
      - "skills/retro-web-ui/**"
      - "scripts/build_native.py"
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "VERSION"
      - "pyproject.toml"
      - "deployment/**"
      - "distribution/**"
      - "retro_web_ui_gui/**"
      - "skills/retro-web-ui/**"
      - "scripts/build_native.py"

permissions:
  contents: read

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install pinned native build dependencies
        run: python -m pip install ".[native]"
      - name: Install Linux desktop runtime dependency
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1
      - name: Install compatible Codex without bundling it
        shell: bash
        run: |
          npm_config_cache="$RUNNER_TEMP/npm-cache" npm install --prefix "$RUNNER_TEMP/codex" @openai/codex@0.150.0-alpha.8
          echo "$RUNNER_TEMP/codex/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify external Codex prerequisite
        shell: bash
        run: |
          codex --version
          codex app-server --help
      - name: Build and exercise host-native application
        run: python scripts/build_native.py --output dist/native --app-server-smoke
      - name: Inspect generated artifact metadata
        shell: bash
        run: |
          python -m json.tool dist/native/native-report-*.json
          python -c "import json, os; from pathlib import Path; reports=list(Path('dist/native').glob('native-report-*.json')); assert len(reports) == 1; report=json.loads(reports[0].read_text()); assert report['candidateCommit'] == os.environ['GITHUB_SHA']; assert report['candidateClean'] is True; assert report['workspaceLifecycle']['restore']['privacyScan'] == 'clean'; files=list(Path('dist/native').glob('*.sha256')); assert files; print('checksums', len(files))"
      - name: Upload native release candidates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.platform }}
          path: dist/native/*
          if-no-files-found: error
