name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag, version, and release notes
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"

  native:
    needs: metadata
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  publish:
    needs: [metadata, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked fixture dependencies
        run: npm ci
      - name: Install Python release tooling
        run: python -m pip install "setuptools>=69" "build>=1.2,<2" ".[gui]"
      - name: Download gated native artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Verify native release set
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("dist/native")
          for platform in ("linux", "macos", "windows"):
              archives = [
                  path
                  for path in root.glob(f"retro-web-ui-gui-*-{platform}-*")
                  if not path.name.endswith(".sha256")
              ]
              if len(archives) != 1:
                  raise SystemExit(f"Expected one {platform} archive, found: {archives}")
              checksum = archives[0].with_name(archives[0].name + ".sha256")
              report = list(root.glob(f"native-report-{platform}-*.json"))
              if not checksum.is_file() or len(report) != 1:
                  raise SystemExit(f"Incomplete {platform} release set")
          PY
          cd dist/native
          sha256sum --check *.sha256
      - name: Run publication gates
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          npm run build:fixtures
          npm audit --omit=dev --audit-level=moderate
          python scripts/quick_validate_compat.py skills/retro-web-ui
          python -m unittest discover -s tests -v
          python tests/visual_smoke.py --browser /usr/bin/google-chrome --output "$RUNNER_TEMP/retro-showcase"
          python tests/runtime_smoke.py --browser /usr/bin/google-chrome --output "$RUNNER_TEMP/retro-runtime"
          python scripts/package_cli.py --output "$RUNNER_TEMP/retro-cli-a"
          python scripts/package_cli.py --output "$RUNNER_TEMP/retro-cli-b"
          python tests/package_smoke.py "$RUNNER_TEMP/retro-cli-a" --compare "$RUNNER_TEMP/retro-cli-b"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Package reproducibly
        run: |
          python scripts/package_skill.py
          python scripts/package_cli.py
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            dist/native/*
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
