name: CI

on:
  push:
  pull_request:

jobs:
  python-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Verify minimum supported Python
        run: |
          python -m unittest discover -s tests -v
          python scripts/quick_validate_compat.py skills/retro-web-ui

  cli-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python release tooling
        run: python -m pip install "setuptools>=69" "build>=1.2,<2"
      - name: Unit, Skill, reproducibility, and clean-install gates
        run: |
          python -m unittest discover -s tests -v
          python scripts/quick_validate_compat.py skills/retro-web-ui
          python scripts/package_cli.py --output cli-artifact-a
          python scripts/package_cli.py --output cli-artifact-b
          python tests/package_smoke.py cli-artifact-a --compare cli-artifact-b

  gui-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional desktop dependencies
        run: python -m pip install ".[gui]"
      - name: Verify desktop imports, widgets, and controller state
        run: |
          retro-web-ui-gui --version
          python -m unittest tests.test_gui_widgets tests.test_gui_controller tests.test_codex_bridge tests.test_gui_core_workflow -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked fixture dependencies
        run: npm ci
      - name: Install Python release tooling
        run: python -m pip install "setuptools>=69" "build>=1.2,<2"
      - name: Build framework fixtures
        run: npm run build:fixtures
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Unit and fixture tests
        run: python -m unittest discover -s tests -v
      - name: Build and clean-install CLI packages reproducibly
        run: |
          python scripts/package_cli.py --output "$RUNNER_TEMP/retro-cli-a"
          python scripts/package_cli.py --output "$RUNNER_TEMP/retro-cli-b"
          python tests/package_smoke.py "$RUNNER_TEMP/retro-cli-a" --compare "$RUNNER_TEMP/retro-cli-b"
      - name: Validate Skill format
        run: python scripts/quick_validate_compat.py skills/retro-web-ui
      - name: Browser interaction and render smoke
        run: |
          python tests/visual_smoke.py --browser /usr/bin/google-chrome --output "$RUNNER_TEMP/retro-showcase"
          python tests/runtime_smoke.py --browser /usr/bin/google-chrome --output "$RUNNER_TEMP/retro-runtime"
      - name: Upload browser renders for review
        uses: actions/upload-artifact@v6
        with:
          name: browser-renders
          path: |
            ${{ runner.temp }}/retro-showcase/*.png
            ${{ runner.temp }}/retro-runtime/*.png
            ${{ runner.temp }}/retro-cli-a/*
          if-no-files-found: error
      - name: Diff hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
